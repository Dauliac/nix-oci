# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}
jobs:
  check:
    needs:
      - lint
      - eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check flake
        run: nix flake check --print-build-logs
    timeout-minutes: 60
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run unit tests
        run: |
          set -euo pipefail
          failures=$(nix eval .#tests --json --apply \
            'ts: builtins.filter (n: (ts.${n}).expected != (ts.${n}).expr) (builtins.attrNames ts)')
          if [ "$failures" != "[]" ]; then
            echo "Failing unit tests:"
            echo "$failures"
            exit 1
          fi
          echo "All unit tests pass."
      - name: Evaluate flake outputs
        run: nix flake show --all-systems > /dev/null
    timeout-minutes: 20
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Lint prose (Vale)
        run: nix build .#checks.x86_64-linux.lint-vale --print-build-logs
      - name: Check formatting (treefmt)
        run: nix build .#checks.x86_64-linux.treefmt --print-build-logs
    timeout-minutes: 15
name: CI
"on":
  pull_request:
    paths-ignore:
      - '**/*.md'
      - .claude/**
      - docs/**
  push:
    branches:
      - main
