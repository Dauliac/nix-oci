# This file is automatically generated from Nix configuration. Do not edit directly.
concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}
jobs:
  check:
    if: always()
    needs:
      - lint
      - eval
      - check-bdd-vm
      - check-bdd-app
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate upstream results
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "eval:${{ needs.eval.result }}" \
            "check-bdd-vm:${{ needs.check-bdd-vm.result }}" \
            "check-bdd-app:${{ needs.check-bdd-app.result }}"; do
            job=${pair%%:*}
            result=${pair#*:}
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit $failed
  check-bdd-app:
    needs:
      - lint
      - eval
      - check-bdd-vm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build bdd-app-${{ matrix.container }}
        run: nix build .#checks.x86_64-linux.bdd-app-${{ matrix.container }} --print-build-logs
    strategy:
      fail-fast: false
      matrix:
        container:
          - example-hardened
          - example-hello
          - minimalist-with-install-nix
          - minimalistWithCoherence
          - minimalistWithCoherenceAndCustom
          - minimalistWithComplianceTrivy
          - minimalistWithContainerStructureTest
          - minimalistWithCredentialsLeaksTrivy
          - minimalistWithCustomPolicy
          - minimalistWithDebug
          - minimalistWithDgoss
          - minimalistWithExtraPolicies
          - minimalistWithGrype
          - minimalistWithHealthcheck
          - minimalistWithName
          - minimalistWithTrivyIgnore
          - minimalistWithTrivyIgnoreAndExtra
          - minimalistWithVulnix
          - myapp-nginx
          - myapp-php
          - myapp-redis
          - nginx-nixos
          - nixosCaddyCst
          - nixosDnsmasqCst
          - nixosNginxCst
          - nixosNginxCustomModules
          - nixosNginxDeps
          - nixosNginxHealthcheck
          - nixosNginxNonroot
          - nixosNginxPerf
          - nixosNginxReverseProxy
          - nixosNginxStaticSite
          - nixosNginxSyspackages
          - nixosPostgres
          - nixosPostgresExtensions
          - nixosPostgresHealthcheck
          - nixosRedisCst
          - nixosRedisHealthcheck
          - nixosRedisPerf
          - withRootUserAndPackage
          - write-shell-application
          - write-shell-script-bin
    timeout-minutes: 45
  check-bdd-vm:
    needs:
      - lint
      - eval
    runs-on: ubuntu-latest
    steps:
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          docker-images: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          tool-cache: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build bdd-vm
        run: nix build .#checks.x86_64-linux.bdd-vm --print-build-logs
    timeout-minutes: 60
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run unit tests
        run: |
          set -euo pipefail
          failures=$(nix eval .#tests --json --apply \
            'ts: builtins.filter (n: (ts.${n}).expected != (ts.${n}).expr) (builtins.attrNames ts)')
          if [ "$failures" != "[]" ]; then
            echo "Failing unit tests:"
            echo "$failures"
            exit 1
          fi
          echo "All unit tests pass."
      - name: Evaluate flake outputs
        run: nix flake show --all-systems > /dev/null
    timeout-minutes: 20
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Lint prose (Vale)
        run: nix build .#checks.x86_64-linux.lint-vale --print-build-logs
      - name: Check formatting (treefmt)
        run: nix build .#checks.x86_64-linux.treefmt --print-build-logs
    timeout-minutes: 15
name: CI
"on":
  pull_request:
    paths-ignore:
      - '**/*.md'
      - .claude/**
      - docs/**
  push:
    branches:
      - main
