skip_output:
  - meta
  - success
commit-msg:
  parallel: true
  commands:
    commitlint:
      skip:
        - merge
        - rebase
      tags: check lint commit
      run: cat "{1}" | convco check --from-stdin
    typos:
      skip:
        - merge
        - rebase
      tags: check commit typos
      run: cat "{1}" | head -n 1 | typos -
pre-commit:
  parallel: true
  commands:
    formatter:
      tags: formatter
      run: nix fmt
      stage_fixed: true
    show:
      tags: show
      run: nix flake show
    checks:
      tags: build checks
      run: nix flake check --quiet
    test:
      tags: checks
      run: |
        task test --verbose --output prefixed
    vale:
      # Fast Vale-only gate on staged markdown changes. `nix flake check`
      # above also covers Vale but rebuilds every check; this hook is
      # scoped to prose only so contributors get fast feedback on doc
      # edits without running the VM/BDD suite.
      tags: lint docs
      glob: "*.md"
      run: nix build .#checks.x86_64-linux.lint-vale --print-build-logs
